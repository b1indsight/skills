interface:
  display_name: "Plan-First Feature Workflow"
  short_description: "Plan, get approval, and track the PR's change timeline"
  default_prompt: "Use $plan-first-workflow. Prepare the first draft commit with the plan, one new acceptance test, and any changed cross-module declarations with explicit unimplemented stubs where a body is required. Wait for explicit approval before implementing behavior on the same PR."
policy:
  allow_implicit_invocation: true
