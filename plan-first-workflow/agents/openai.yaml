interface:
  display_name: "Plan-First Feature Workflow"
  short_description: "Plan, get approval, and track the PR's change timeline"
  default_prompt: "Use $plan-first-workflow. Prepare the first draft commit with the plan, one acceptance test, and empty definitions for changed cross-module interfaces. Wait for explicit approval before implementing behavior on the same PR."
policy:
  allow_implicit_invocation: true
