interface:
  display_name: "Plan-First Feature Workflow"
  short_description: "Plan, approve, and build reviewable change stacks"
  default_prompt: "Use $plan-first-workflow to plan this feature, get approval on the draft PR, implement it test-first as a stack of cohesive changes on the same bookmark and PR, and synchronize affected project documentation before marking it ready."
policy:
  allow_implicit_invocation: true
